<p>Redirecionando para a ProtecExtintores…</p>
<script>
const aliases=['config','configuracoes','painel','manutencoes','extintores','estoque','pecas-precos','clientes','funcionarios','produtos','pedidos','garantias','avaliacoes','acessos'];
const parts=location.pathname.split('/').filter(Boolean),at=parts.findIndex(part=>aliases.includes(part.toLowerCase()));
if(at>=0){sessionStorage.setItem('__protecPendingRoute','/'+parts[at].toLowerCase());const base='/'+parts.slice(0,at).join('/');location.replace((base==='/'?'':base)+'/index.html');}
else location.replace('./index.html');
</script>
