<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrindo página…</title>
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-content:center;gap:12px;padding:24px;background:#f7f7f5;color:#24282e;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}body:before{content:"✓";display:grid;place-items:center;width:58px;height:58px;margin:0 auto;border-radius:18px;background:#e23d28;color:#fff;font-size:30px;font-weight:900;box-shadow:0 12px 28px rgb(226 61 40 / 28%)}p{margin:0;color:#667085}
</style>
<noscript><meta http-equiv="refresh" content="0;url=./index.html"></noscript>
</head>
<body>
<p>Redirecionando para a ProtecExtintores…</p>
<script>
const aliases=['config','configuracoes','painel','manutencoes','extintores','estoque','pecas-precos','clientes','funcionarios','produtos','pedidos','garantias','avaliacoes','acessos'];
const parts=location.pathname.split('/').filter(Boolean),at=parts.findIndex(part=>aliases.includes(part.toLowerCase()));
if(at>=0){sessionStorage.setItem('__protecPendingRoute','/'+parts[at].toLowerCase());const base='/'+parts.slice(0,at).join('/');location.replace((base==='/'?'':base)+'/index.html');}
else location.replace('./index.html');
</script>
<noscript><p><a href="./index.html">Abrir a página inicial</a></p></noscript>
</body>
</html>
