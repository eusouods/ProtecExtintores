name: Publicar ProtecExtintores no GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar o projeto completo
        run: node ProtecExtintores.mjs extrair --destino ../protec-generated
      - name: Validar o projeto que será publicado
        working-directory: ../protec-generated
        shell: bash
        run: |
          set -euo pipefail
          for f in site/*.js site/*.mjs api-cloudflare/src/*.js api-cloudflare/src/*.mjs; do node --check "$f"; done
          node scripts/release-offline.mjs
          node scripts/test-service-rules.mjs
          node scripts/test-offline-rules.mjs
          node scripts/verify-theme.mjs
          node scripts/verify-site.mjs
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar o site completo
        run: node ProtecExtintores.mjs extrair --destino ../protec-generated
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../protec-generated/site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
