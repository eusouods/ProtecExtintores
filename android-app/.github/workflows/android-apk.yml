name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build debug APK
        working-directory: android-app
        run: bash ./gradlew --no-daemon --console=plain lintDebug assembleDebug

      - name: Name installation file
        run: |
          mkdir -p android-dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk android-dist/ProtecExtintores.apk
          sha256sum android-dist/ProtecExtintores.apk > android-dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtecExtintores-APK
          path: android-dist/
          if-no-files-found: error
          retention-days: 14

