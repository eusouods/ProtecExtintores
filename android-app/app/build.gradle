plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.protecextintores.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.protecextintores.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.1.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/offline-assets'))
}

def offlineSite = tasks.register('syncOfflineSite', Sync) {
    from file('../../site')
    into layout.buildDirectory.dir('generated/offline-assets/site')
}
tasks.named('preBuild').configure { dependsOn offlineSite }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.1'
}
