name: Verificar código
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos scripts
        run: |
          for f in site/*.js api-cloudflare/src/index.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('site/manifest.webmanifest','utf8'))"
          node scripts/verify-site.mjs
