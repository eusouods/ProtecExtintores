name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing key
        shell: bash
        env:
          PROTEC_KEYSTORE_BASE64: ${{ secrets.PROTEC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROTEC_KEYSTORE_BASE64"
          printf '%s' "$PROTEC_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.p12
          test -s app/release-keystore.p12

      - name: Build release APK
        shell: bash
        env:
          PROTEC_STORE_PASSWORD: ${{ secrets.PROTEC_STORE_PASSWORD }}
          PROTEC_KEY_ALIAS: ${{ secrets.PROTEC_KEY_ALIAS }}
          PROTEC_KEY_PASSWORD: ${{ secrets.PROTEC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --console=plain assembleRelease \
            -PPROTEC_STORE_FILE=release-keystore.p12 \
            -PPROTEC_STORE_PASSWORD="$PROTEC_STORE_PASSWORD" \
            -PPROTEC_KEY_ALIAS="$PROTEC_KEY_ALIAS" \
            -PPROTEC_KEY_PASSWORD="$PROTEC_KEY_PASSWORD" | tee android-build.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ProtecFuncionario-diagnostico
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-dist
          cp app/build/outputs/apk/release/app-release.apk android-dist/ProtecFuncionario.apk
          sha256sum android-dist/ProtecFuncionario.apk > android-dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ProtecFuncionario-APK
          path: android-dist/
          if-no-files-found: error
          retention-days: 14
